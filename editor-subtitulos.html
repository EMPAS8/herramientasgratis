<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de Subtítulos (.srt)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEAE0; --paper-2:#E2DDCC;
  --card:#FBFAF5; --line:#C9C0AC;
  --ink:#221F1B; --ink-soft:#6B6455;
  --accent:#AE3B2C; --accent-ink:#FBFAF5;
  --danger:#8C3324;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1712; --paper-2:#23201A;
    --card:#26221B; --line:#443E30;
    --ink:#EFE9DA; --ink-soft:#B0A68F;
    --accent:#E0664F; --accent-ink:#1A1712;
    --danger:#E0664F;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1712; --paper-2:#23201A;
  --card:#26221B; --line:#443E30;
  --ink:#EFE9DA; --ink-soft:#B0A68F;
  --accent:#E0664F; --accent-ink:#1A1712;
  --danger:#E0664F;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;min-height:100%;
}
h1,h2{font-family:"Source Serif 4",Georgia,serif;margin:0;}

header{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px;
  border-bottom:1px solid var(--line);background:var(--paper);flex-shrink:0;
}
header h1{font-size:1.2rem;font-weight:600;}
header .tag{color:var(--ink-soft);font-size:0.8rem;}
header .back{color:var(--ink-soft);text-decoration:none;font-size:0.82rem;}
header .back:hover{color:var(--accent);}
header .fb-btn{
  margin-left:auto;flex-shrink:0;font-family:inherit;font-size:0.82rem;
  padding:7px 12px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;
}
header .fb-btn:hover{border-color:var(--accent);color:var(--accent);}

.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-shrink:0;
}
.toolbar .grp{display:flex;align-items:center;gap:6px;}
.toolbar label{font-size:0.78rem;color:var(--ink-soft);white-space:nowrap;}
.toolbar input[type=text],.toolbar input[type=number]{
  padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  font-family:inherit;font-size:0.82rem;width:80px;
}
button.tbtn{
  font-family:inherit;font-size:0.8rem;padding:8px 12px;border-radius:7px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap;
}
button.tbtn:hover{border-color:var(--ink-soft);}
button.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
button.tbtn.primary:hover{opacity:0.92;}
.spacer{flex:1;}
input[type=file]{display:none;}

.body-area{flex:1;overflow-y:auto;padding:18px 20px 100px;max-width:760px;margin:0 auto;width:100%;}
.empty{color:var(--ink-soft);font-size:0.92rem;text-align:center;margin-top:60px;}
.empty .dz{
  border:1.5px dashed var(--line);border-radius:10px;padding:40px 20px;cursor:pointer;max-width:420px;margin:0 auto;
}
.empty .dz:hover{border-color:var(--accent);color:var(--ink);}
.empty .dz strong{color:var(--ink);}

.cue{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;
}
.cue .num{font-size:0.76rem;color:var(--ink-soft);width:26px;flex-shrink:0;padding-top:9px;text-align:right;}
.cue .main{flex:1;min-width:0;}
.cue .times{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.cue .times input{
  font-family:inherit;font-size:0.78rem;padding:6px 8px;border-radius:6px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);width:132px;
}
.cue .times input.invalid{border-color:var(--danger);color:var(--danger);}
.cue .times .arrow{color:var(--ink-soft);font-size:0.8rem;}
.cue textarea{
  width:100%;min-height:46px;resize:vertical;padding:8px 10px;border-radius:7px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:inherit;font-size:0.86rem;
}
.cue .del{
  flex-shrink:0;background:none;border:1px solid var(--line);border-radius:6px;
  color:var(--danger);font-size:0.95rem;width:30px;height:30px;cursor:pointer;margin-top:2px;
}
.cue .del:hover{border-color:var(--danger);}

.bottombar{
  display:flex;gap:8px;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  width:min(400px, calc(100vw - 36px));
}
button.download{
  flex:1;padding:13px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);
  font-weight:600;font-size:0.9rem;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.18);
}
button.download.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;}
button.download:hover{opacity:0.92;}
button.download:disabled{opacity:0.5;cursor:not-allowed;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
.modal{background:var(--paper);border-radius:10px;padding:18px;width:min(420px,100%);}
.modal h3{margin-bottom:10px;font-size:1rem;font-family:"Source Serif 4",Georgia,serif;}
.modal textarea{width:100%;min-height:74px;resize:vertical;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:0.88rem;margin-bottom:10px;}
.modal input[type="email"]{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:0.88rem;margin-bottom:10px;}
.modal .mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
.modal button.tbtn{width:auto;}

@media (max-width:640px){
  .toolbar{flex-direction:column;align-items:stretch;}
  .toolbar .grp{justify-content:space-between;}
  .cue{flex-direction:column;}
  .cue .num{width:auto;text-align:left;padding-top:0;}
  .cue .times input{width:100%;}
}
::-webkit-scrollbar{width:11px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← Herramientas Gratis</a>
  <h1>Editor de Subtítulos</h1>
  <span class="tag">edita texto, corrige tiempos y desplaza tu .srt — gratis</span>
  <button class="fb-btn" id="fbOpenBtn">💬 Comentarios / errores</button>
</header>

<div class="toolbar" id="toolbar" style="display:none;">
  <button class="tbtn" id="uploadAgainBtn">Subir otro archivo</button>
  <div class="grp">
    <label>Desplazar</label>
    <input type="number" id="shiftAmount" value="0" step="0.1">
    <label>seg.</label>
    <button class="tbtn" id="applyShift">Aplicar</button>
  </div>
  <button class="tbtn" id="fixOverlaps">Corregir solapamientos</button>
  <div class="spacer"></div>
  <button class="tbtn" id="addCue">+ Agregar línea</button>
</div>

<div class="body-area" id="bodyArea">
  <div class="empty">
    <div class="dz" id="dropzone">
      <strong>Haz clic para elegir</strong> o arrastra un archivo .srt aquí<br>
      <span style="font-size:0.8rem;">o pega el texto abajo</span>
    </div>
    <input type="file" id="fileInput" accept=".srt,text/plain">
    <textarea id="pasteArea" placeholder="Pega aquí el contenido de tu .srt..." style="width:100%;max-width:420px;min-height:100px;margin:16px auto 8px;display:block;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:0.86rem;"></textarea>
    <button class="tbtn" id="loadPasted" style="max-width:420px;margin:0 auto;display:block;">Cargar texto pegado</button>
  </div>
</div>

<div class="bottombar" id="bottombar" style="display:none;">
  <button class="download secondary" id="resetBtn">Empezar de nuevo</button>
  <button class="download" id="downloadBtn">Descargar .srt</button>
</div>

<script>
const $ = id => document.getElementById(id);
let cues = [];

/* ---------- time helpers ---------- */
function msToSrt(ms){
  ms = Math.max(0, Math.round(ms));
  const h = Math.floor(ms/3600000);
  const m = Math.floor((ms%3600000)/60000);
  const s = Math.floor((ms%60000)/1000);
  const msRem = ms%1000;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(msRem).padStart(3,'0')}`;
}
function srtToMs(str){
  const m = str.trim().match(/^(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})$/);
  if(!m) return null;
  const [,h,mi,s,frac] = m;
  const ms = frac.padEnd(3,'0').slice(0,3);
  return (+h)*3600000 + (+mi)*60000 + (+s)*1000 + (+ms);
}

/* ---------- parse .srt ---------- */
function parseSrt(text){
  const blocks = text.replace(/\r/g,'').trim().split(/\n\s*\n/);
  const result = [];
  for(const block of blocks){
    const lines = block.split('\n').filter(l=>l.trim()!=='');
    if(lines.length < 2) continue;
    let idx = 0;
    if(/^\d+$/.test(lines[0].trim())) idx = 1;
    const timeLine = lines[idx];
    const m = timeLine.match(/(\d{2}:\d{2}:\d{2}[,.]\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}[,.]\d{3})/);
    if(!m) continue;
    const start = srtToMs(m[1]);
    const end = srtToMs(m[2]);
    const text2 = lines.slice(idx+1).join('\n');
    result.push({ start, end, text: text2 });
  }
  return result;
}

function buildSrt(){
  return cues.map((c,i)=> `${i+1}\n${msToSrt(c.start)} --> ${msToSrt(c.end)}\n${c.text}`).join('\n\n') + '\n';
}

/* ---------- render ---------- */
function renderCues(){
  const area = $('bodyArea');
  area.innerHTML = '';
  cues.forEach((cue, i)=>{
    const div = document.createElement('div');
    div.className = 'cue';
    div.innerHTML = `
      <div class="num">${i+1}</div>
      <div class="main">
        <div class="times">
          <input type="text" class="startInput" value="${msToSrt(cue.start)}">
          <span class="arrow">→</span>
          <input type="text" class="endInput" value="${msToSrt(cue.end)}">
        </div>
        <textarea class="textInput">${cue.text.replace(/</g,'&lt;')}</textarea>
      </div>
      <button class="del" title="Eliminar">×</button>
    `;
    const startInput = div.querySelector('.startInput');
    const endInput = div.querySelector('.endInput');
    const textInput = div.querySelector('.textInput');

    startInput.addEventListener('change', ()=>{
      const v = srtToMs(startInput.value);
      if(v===null){ startInput.classList.add('invalid'); return; }
      startInput.classList.remove('invalid');
      cues[i].start = v;
    });
    endInput.addEventListener('change', ()=>{
      const v = srtToMs(endInput.value);
      if(v===null){ endInput.classList.add('invalid'); return; }
      endInput.classList.remove('invalid');
      cues[i].end = v;
    });
    textInput.addEventListener('input', ()=>{ cues[i].text = textInput.value; });
    div.querySelector('.del').addEventListener('click', ()=>{
      cues.splice(i,1); renderCues();
    });
    area.appendChild(div);
  });
}

/* ---------- load ---------- */
function showEditor(){
  $('toolbar').style.display = '';
  $('bottombar').style.display = '';
  renderCues();
}

function loadFromText(text){
  const parsed = parseSrt(text);
  if(parsed.length === 0){
    alert('No se encontraron subtítulos válidos en ese archivo o texto.');
    return;
  }
  cues = parsed;
  showEditor();
}

$('dropzone').addEventListener('click', ()=> $('fileInput').click());
$('dropzone').addEventListener('dragover', e=>{ e.preventDefault(); $('dropzone').style.borderColor='var(--accent)'; });
$('dropzone').addEventListener('dragleave', ()=>{ $('dropzone').style.borderColor='var(--line)'; });
$('dropzone').addEventListener('drop', e=>{
  e.preventDefault(); $('dropzone').style.borderColor='var(--line)';
  const file = e.dataTransfer.files[0];
  if(file) file.text().then(loadFromText);
});
$('fileInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file) file.text().then(loadFromText);
});
$('loadPasted').addEventListener('click', ()=>{
  const text = $('pasteArea').value;
  if(text.trim()) loadFromText(text);
});

/* ---------- toolbar actions ---------- */
$('applyShift').addEventListener('click', ()=>{
  const secs = parseFloat($('shiftAmount').value) || 0;
  const ms = secs*1000;
  cues.forEach(c=>{
    c.start = Math.max(0, c.start+ms);
    c.end = Math.max(0, c.end+ms);
  });
  renderCues();
});

$('fixOverlaps').addEventListener('click', ()=>{
  cues.sort((a,b)=> a.start-b.start);
  for(let i=0;i<cues.length-1;i++){
    if(cues[i].end > cues[i+1].start){
      cues[i].end = Math.max(cues[i].start+100, cues[i+1].start-1);
    }
  }
  renderCues();
});

$('addCue').addEventListener('click', ()=>{
  const last = cues[cues.length-1];
  const start = last ? last.end + 200 : 0;
  cues.push({ start, end: start+2000, text: 'Nueva línea' });
  renderCues();
});

$('uploadAgainBtn').addEventListener('click', resetAll);
$('resetBtn').addEventListener('click', ()=>{
  if(cues.length===0 || confirm('¿Descartar los subtítulos actuales?')) resetAll();
});
function resetAll(){
  cues = [];
  $('toolbar').style.display = 'none';
  $('bottombar').style.display = 'none';
  $('bodyArea').innerHTML = `
    <div class="empty">
      <div class="dz" id="dropzone">
        <strong>Haz clic para elegir</strong> o arrastra un archivo .srt aquí<br>
        <span style="font-size:0.8rem;">o pega el texto abajo</span>
      </div>
      <input type="file" id="fileInput" accept=".srt,text/plain">
      <textarea id="pasteArea" placeholder="Pega aquí el contenido de tu .srt..." style="width:100%;max-width:420px;min-height:100px;margin:16px auto 8px;display:block;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:0.86rem;"></textarea>
      <button class="tbtn" id="loadPasted" style="max-width:420px;margin:0 auto;display:block;">Cargar texto pegado</button>
    </div>`;
  rebindEmptyState();
}
function rebindEmptyState(){
  $('dropzone').addEventListener('click', ()=> $('fileInput').click());
  $('dropzone').addEventListener('dragover', e=>{ e.preventDefault(); $('dropzone').style.borderColor='var(--accent)'; });
  $('dropzone').addEventListener('dragleave', ()=>{ $('dropzone').style.borderColor='var(--line)'; });
  $('dropzone').addEventListener('drop', e=>{
    e.preventDefault(); $('dropzone').style.borderColor='var(--line)';
    const file = e.dataTransfer.files[0];
    if(file) file.text().then(loadFromText);
  });
  $('fileInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) file.text().then(loadFromText);
  });
  $('loadPasted').addEventListener('click', ()=>{
    const text = $('pasteArea').value;
    if(text.trim()) loadFromText(text);
  });
}

/* ---------- download ---------- */
let _downloadsNS=null;
async function getDownloads(){
  if(_downloadsNS!==null) return _downloadsNS;
  try{ if(window.claude && window.claude.use) _downloadsNS = await window.claude.use('downloads'); }
  catch(e){ _downloadsNS=null; }
  return _downloadsNS;
}
async function saveFile(blob, name){
  const dl = await getDownloads();
  if(dl){ try{ await dl.save({filename:name, data:blob}); return; }catch(e){} }
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

$('downloadBtn').addEventListener('click', async ()=>{
  if(cues.length===0) return;
  const blob = new Blob([buildSrt()], { type: 'application/x-subrip' });
  await saveFile(blob, 'subtitulos-editado.srt');
});

/* ================= FEEDBACK ================= */
document.getElementById('fbOpenBtn').addEventListener('click', openFeedbackModal);
function openFeedbackModal(){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <h3>💬 ¿Falta algo o algo no sirve?</h3>
    <p style="margin:0 0 14px;color:var(--ink-soft);font-size:0.82rem;line-height:1.5;">Cuéntame qué herramienta te gustaría ver, o repórtame si algo está fallando.</p>
    <form action="https://formsubmit.co/musica.wasd@gmail.com" method="POST" target="fbFrame_hidden">
      <input type="hidden" name="_subject" value="Editor-Subtitulos Feedback">
      <input type="hidden" name="_captcha" value="false">
      <input type="email" name="Tu correo (opcional)" placeholder="Tu correo (opcional, por si quieres respuesta)">
      <textarea name="Mensaje" placeholder="Escribe tu recomendación o problema aquí..." required></textarea>
      <div class="mrow">
        <button type="button" class="tbtn" id="fbCancel">Cancelar</button>
        <button type="submit" class="tbtn primary" id="fbSubmit">Enviar</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(bg);

  let iframe = document.getElementById('fbFrame_hidden');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.name='fbFrame_hidden'; iframe.id='fbFrame_hidden'; iframe.style.display='none';
    document.body.appendChild(iframe);
  }

  const form = bg.querySelector('form');
  bg.querySelector('#fbCancel').onclick = ()=> bg.remove();
  form.addEventListener('submit', ()=>{
    const btn = bg.querySelector('#fbSubmit');
    btn.disabled = true; btn.textContent = 'Enviando…';
    setTimeout(()=>{
      bg.innerHTML = `<div class="modal"><h3>¡Gracias! 🙌</h3>
        <p style="margin:0 0 14px;color:var(--ink-soft);font-size:0.88rem;">Tu comentario fue enviado.</p>
        <div class="mrow"><button class="tbtn primary" id="fbClose">Cerrar</button></div></div>`;
      bg.querySelector('#fbClose').onclick = ()=> bg.remove();
    }, 900);
  });
}
</script>
</body>
</html>
