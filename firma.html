<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de Firma Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Dancing+Script:wght@500;700&family=Caveat:wght@500;700&family=Pacifico&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEAE0; --paper-2:#E2DDCC;
  --card:#FBFAF5; --line:#C9C0AC;
  --ink:#221F1B; --ink-soft:#6B6455;
  --accent:#AE3B2C; --accent-ink:#FBFAF5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1712; --paper-2:#23201A;
    --card:#26221B; --line:#443E30;
    --ink:#EFE9DA; --ink-soft:#B0A68F;
    --accent:#E0664F; --accent-ink:#1A1712;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1712; --paper-2:#23201A;
  --card:#26221B; --line:#443E30;
  --ink:#EFE9DA; --ink-soft:#B0A68F;
  --accent:#E0664F; --accent-ink:#1A1712;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;min-height:100%;
}
h1,h2{font-family:"Source Serif 4",Georgia,serif;margin:0;}

header{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px;
  border-bottom:1px solid var(--line);background:var(--paper);flex-shrink:0;
}
header h1{font-size:1.2rem;font-weight:600;}
header .tag{color:var(--ink-soft);font-size:0.8rem;}
header .back{color:var(--ink-soft);text-decoration:none;font-size:0.82rem;}
header .back:hover{color:var(--accent);}
header .fb-btn{
  margin-left:auto;flex-shrink:0;font-family:inherit;font-size:0.82rem;
  padding:7px 12px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;
}
header .fb-btn:hover{border-color:var(--accent);color:var(--accent);}

.shell{flex:1;display:flex;min-height:0;}
.formcol{width:min(360px,42vw);min-width:280px;border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 100px;}
.previewcol{flex:1;overflow:auto;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;gap:16px;}

.tabs{display:flex;gap:6px;margin-bottom:18px;}
.tabbtn{flex:1;padding:9px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-family:inherit;font-size:0.84rem;cursor:pointer;}
.tabbtn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}

.section{margin-bottom:20px;}
.section h2{font-size:0.86rem;color:var(--ink-soft);font-weight:600;font-family:inherit;margin-bottom:8px;}
label{display:block;font-size:0.76rem;color:var(--ink-soft);margin:10px 0 4px;}
label:first-of-type{margin-top:0;}
input[type=text],select{
  width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:0.86rem;
}
input[type=range]{width:100%;}
.color-input{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
.color-input input[type="color"]{width:30px;height:30px;border:none;background:none;padding:0;cursor:pointer;}
.color-input span{font-size:0.8rem;color:var(--ink-soft);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

button.btn{
  font-family:inherit;font-size:0.84rem;padding:9px 14px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;width:100%;
}
button.btn:hover{border-color:var(--ink-soft);}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
button.btn.primary:hover{opacity:0.92;}

.hint{color:var(--ink-soft);font-size:0.76rem;line-height:1.5;text-align:center;max-width:340px;}

.checker{
  background-image:
    linear-gradient(45deg,#bbb 25%,transparent 25%),
    linear-gradient(-45deg,#bbb 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#bbb 75%),
    linear-gradient(-45deg,transparent 75%,#bbb 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0px;
  background-color:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);
}
#drawCanvas, #typeCanvas{display:block;width:100%;max-width:480px;height:220px;touch-action:none;cursor:crosshair;}

.bottombar{
  display:flex;gap:8px;position:fixed;bottom:14px;left:18px;
  width:min(324px, calc(42vw - 36px));min-width:264px;
}
button.download{
  flex:1;padding:13px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);
  font-weight:600;font-size:0.9rem;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.18);
}
button.download.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;}
button.download:hover{opacity:0.92;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
.modal{background:var(--paper);border-radius:10px;padding:18px;width:min(420px,100%);}
.modal h3{margin-bottom:10px;font-size:1rem;font-family:"Source Serif 4",Georgia,serif;}
.modal textarea{width:100%;min-height:74px;resize:vertical;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:0.88rem;margin-bottom:10px;}
.modal input[type="email"]{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:0.88rem;margin-bottom:10px;}
.modal .mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
.modal button.btn{width:auto;}

@media (max-width:760px){
  .shell{flex-direction:column;overflow-y:auto;}
  .formcol{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:none;}
  .previewcol{padding:16px;}
  .bottombar{max-width:calc(100vw - 36px);width:calc(100vw - 36px);left:18px;}
}
::-webkit-scrollbar{width:11px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← Herramientas Gratis</a>
  <h1>Generador de Firma Digital</h1>
  <span class="tag">dibuja o escribe tu firma — gratis, sin cuentas</span>
  <button class="fb-btn" id="fbOpenBtn">💬 Comentarios / errores</button>
</header>

<div class="shell">
  <div class="formcol">
    <div class="tabs">
      <button class="tabbtn active" data-mode="draw">Dibujar</button>
      <button class="tabbtn" data-mode="type">Escribir</button>
    </div>

    <div id="drawControls" class="section">
      <h2>Firma a mano</h2>
      <label>Color de tinta</label>
      <div class="color-input"><input type="color" id="drawColor" value="#221F1B"><span>Tinta</span></div>
      <label>Grosor del trazo</label>
      <input type="range" id="drawWidth" min="1" max="8" value="3">
      <button class="btn" id="clearDraw" style="margin-top:14px;">Borrar y empezar de nuevo</button>
    </div>

    <div id="typeControls" class="section" style="display:none;">
      <h2>Firma escrita</h2>
      <label>Tu nombre</label>
      <input type="text" id="typeText" placeholder="Ej. María Torres" value="Tu nombre">
      <label>Estilo de letra</label>
      <select id="typeFont">
        <option value="'Dancing Script', cursive">Dancing Script</option>
        <option value="'Caveat', cursive">Caveat</option>
        <option value="'Pacifico', cursive">Pacifico</option>
        <option value="'Sacramento', cursive">Sacramento</option>
      </select>
      <label>Color</label>
      <div class="color-input"><input type="color" id="typeColor" value="#221F1B"><span>Tinta</span></div>
      <label>Tamaño</label>
      <input type="range" id="typeSize" min="30" max="90" value="60">
    </div>

    <p class="hint" style="text-align:left;max-width:none;">Se genera en tu navegador — nada se sube a ningún servidor.</p>
  </div>

  <div class="previewcol">
    <div class="checker"><canvas id="drawCanvas" width="960" height="440"></canvas></div>
    <canvas id="typeCanvas" width="960" height="440" style="display:none;"></canvas>
  </div>
</div>

<div class="bottombar">
  <button class="download secondary" id="clearBtn">Borrar</button>
  <button class="download" id="downloadBtn">Descargar PNG</button>
</div>

<script>
const $ = id => document.getElementById(id);
let mode = 'draw';

/* ---------- tabs ---------- */
document.querySelectorAll('.tabbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    $('drawControls').style.display = mode==='draw' ? '' : 'none';
    $('typeControls').style.display = mode==='type' ? '' : 'none';
    $('drawCanvas').parentElement.style.display = mode==='draw' ? '' : 'none';
    $('typeCanvas').style.display = mode==='type' ? '' : 'none';
    if(mode==='type') renderTypedSignature();
  });
});

/* ---------- draw mode ---------- */
const drawCanvas = $('drawCanvas');
const dctx = drawCanvas.getContext('2d');
let drawing = false, lastX=0, lastY=0;

function canvasPoint(e){
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width/rect.width, scaleY = drawCanvas.height/rect.height;
  return [(e.clientX-rect.left)*scaleX, (e.clientY-rect.top)*scaleY];
}
drawCanvas.addEventListener('pointerdown', e=>{
  drawing = true;
  [lastX,lastY] = canvasPoint(e);
  drawCanvas.setPointerCapture(e.pointerId);
});
drawCanvas.addEventListener('pointermove', e=>{
  if(!drawing) return;
  const [x,y] = canvasPoint(e);
  dctx.strokeStyle = $('drawColor').value;
  dctx.lineWidth = $('drawWidth').value * 2.4;
  dctx.lineCap = 'round'; dctx.lineJoin = 'round';
  dctx.beginPath(); dctx.moveTo(lastX,lastY); dctx.lineTo(x,y); dctx.stroke();
  [lastX,lastY] = [x,y];
});
drawCanvas.addEventListener('pointerup', ()=> drawing=false);
drawCanvas.addEventListener('pointerleave', ()=> drawing=false);

$('clearDraw').addEventListener('click', ()=> dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height));

/* ---------- type mode ---------- */
const typeCanvas = $('typeCanvas');
const tctx = typeCanvas.getContext('2d');

function renderTypedSignature(){
  tctx.clearRect(0,0,typeCanvas.width,typeCanvas.height);
  const text = $('typeText').value || 'Tu nombre';
  const font = $('typeFont').value;
  const size = parseInt($('typeSize').value,10) * 2.4;
  tctx.fillStyle = $('typeColor').value;
  tctx.font = `${size}px ${font}`;
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  tctx.fillText(text, typeCanvas.width/2, typeCanvas.height/2);
}
['typeText','typeFont','typeColor','typeSize'].forEach(id=>{
  $(id).addEventListener('input', renderTypedSignature);
});
document.fonts.ready.then(renderTypedSignature);

/* ---------- clear (active mode) ---------- */
$('clearBtn').addEventListener('click', ()=>{
  if(mode==='draw') dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  else { $('typeText').value=''; renderTypedSignature(); }
});

/* ---------- download ---------- */
let _downloadsNS=null;
async function getDownloads(){
  if(_downloadsNS!==null) return _downloadsNS;
  try{ if(window.claude && window.claude.use) _downloadsNS = await window.claude.use('downloads'); }
  catch(e){ _downloadsNS=null; }
  return _downloadsNS;
}
async function saveFile(blob, name){
  const dl = await getDownloads();
  if(dl){ try{ await dl.save({filename:name, data:blob}); return; }catch(e){} }
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

$('downloadBtn').addEventListener('click', async ()=>{
  const source = mode==='draw' ? drawCanvas : typeCanvas;
  const blob = await new Promise(res=> source.toBlob(res, 'image/png'));
  await saveFile(blob, 'firma.png');
});

/* ================= FEEDBACK ================= */
document.getElementById('fbOpenBtn').addEventListener('click', openFeedbackModal);
function openFeedbackModal(){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <h3>💬 ¿Falta algo o algo no sirve?</h3>
    <p style="margin:0 0 14px;color:var(--ink-soft);font-size:0.82rem;line-height:1.5;">Cuéntame qué herramienta te gustaría ver, o repórtame si algo está fallando.</p>
    <form action="https://formsubmit.co/musica.wasd@gmail.com" method="POST" target="fbFrame_hidden">
      <input type="hidden" name="_subject" value="Firma-Digital Feedback">
      <input type="hidden" name="_captcha" value="false">
      <input type="email" name="Tu correo (opcional)" placeholder="Tu correo (opcional, por si quieres respuesta)">
      <textarea name="Mensaje" placeholder="Escribe tu recomendación o problema aquí..." required></textarea>
      <div class="mrow">
        <button type="button" class="btn" id="fbCancel">Cancelar</button>
        <button type="submit" class="btn primary" id="fbSubmit">Enviar</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(bg);

  let iframe = document.getElementById('fbFrame_hidden');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.name='fbFrame_hidden'; iframe.id='fbFrame_hidden'; iframe.style.display='none';
    document.body.appendChild(iframe);
  }

  const form = bg.querySelector('form');
  bg.querySelector('#fbCancel').onclick = ()=> bg.remove();
  form.addEventListener('submit', ()=>{
    const btn = bg.querySelector('#fbSubmit');
    btn.disabled = true; btn.textContent = 'Enviando…';
    setTimeout(()=>{
      bg.innerHTML = `<div class="modal"><h3>¡Gracias! 🙌</h3>
        <p style="margin:0 0 14px;color:var(--ink-soft);font-size:0.88rem;">Tu comentario fue enviado.</p>
        <div class="mrow"><button class="btn primary" id="fbClose">Cerrar</button></div></div>`;
      bg.querySelector('#fbClose').onclick = ()=> bg.remove();
    }, 900);
  });
}
</script>
</body>
</html>
