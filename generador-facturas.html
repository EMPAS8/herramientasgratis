<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de Facturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --paper:#EAEEE2; --paper-2:#DDE3D0;
  --card:#FBFAF4; --line:#BFC9AC;
  --ink:#1E2B20; --ink-soft:#5B6752;
  --accent:#2E6B4C; --accent-ink:#FBFAF4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161A14; --paper-2:#1F241B;
    --card:#22271D; --line:#3B4433;
    --ink:#E9EEE1; --ink-soft:#A7B39A;
    --accent:#5FB98B; --accent-ink:#12180F;
  }
}
:root[data-theme="dark"]{
  --paper:#161A14; --paper-2:#1F241B;
  --card:#22271D; --line:#3B4433;
  --ink:#E9EEE1; --ink-soft:#A7B39A;
  --accent:#5FB98B; --accent-ink:#12180F;
}
*{box-sizing:border-box;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
h1,h2{font-family:"Source Serif 4",Georgia,serif;margin:0;}
header{
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px;
  border-bottom:1px solid var(--line);flex-shrink:0;background:var(--paper);
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
header h1{font-size:1.2rem;font-weight:600;}
header .tag{color:var(--ink-soft);font-size:0.8rem;}
header .back{color:var(--ink-soft);text-decoration:none;font-size:0.82rem;}
header .back:hover{color:var(--accent);}
header .fb-btn{
  margin-left:auto;flex-shrink:0;font-family:inherit;font-size:0.82rem;
  padding:7px 12px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;
}
header .fb-btn:hover{border-color:var(--accent);color:var(--accent);}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
.modal{background:var(--paper);border-radius:10px;padding:18px;width:min(420px,100%);}
.modal h3{margin-bottom:10px;font-size:1rem;font-family:"Source Serif 4",Georgia,serif;}
.modal textarea{margin-bottom:10px;width:100%;min-height:74px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:0.88rem;resize:vertical;}
.modal input[type="email"]{width:100%;margin-bottom:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:0.88rem;}
.modal .mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
.modal button.btn{
  font-family:inherit;font-size:0.86rem;padding:9px 14px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.modal button.btn:hover{border-color:var(--ink-soft);}
.modal button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.modal button.btn.primary:hover{opacity:0.92;}
.modal button.btn:disabled{opacity:0.5;cursor:not-allowed;}

@media print{
  header, .formcol, button.download, #fbOpenBtn{display:none !important;}
  body, .shell, .previewcol{overflow:visible !important;background:#fff !important;padding:0 !important;height:auto !important;}
  .sheet{box-shadow:none !important;max-width:100% !important;}
}

.shell{flex:1;display:flex;min-height:0;}
.formcol{width:min(440px,44vw);min-width:320px;border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 90px;}
.previewcol{flex:1;overflow-y:auto;background:var(--paper-2);display:flex;justify-content:center;padding:28px 20px 60px;}

.section{margin-bottom:20px;}
.section h2{font-size:0.86rem;color:var(--ink-soft);font-family:inherit;font-weight:600;text-transform:none;margin-bottom:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
label{display:block;font-size:0.74rem;color:var(--ink-soft);margin:8px 0 3px;}
input[type=text],input[type=number],input[type=date],textarea{
  width:100%;padding:8px 9px;border-radius:6px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:0.86rem;
}
textarea{resize:vertical;min-height:52px;}

.items{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);}
.item-row{display:grid;grid-template-columns:1fr 46px 70px 26px;gap:6px;padding:7px;border-bottom:1px solid var(--line);align-items:center;}
.item-row:last-child{border-bottom:none;}
.item-row input{font-size:0.82rem;padding:6px 7px;}
.item-row .rm{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:1rem;}
.item-row .rm:hover{color:#B23A2E;}
.addrow{
  width:100%;padding:8px;border:1px dashed var(--line);background:none;color:var(--ink-soft);
  border-radius:6px;cursor:pointer;font-size:0.8rem;margin-top:8px;
}
.addrow:hover{border-color:var(--accent);color:var(--accent);}

.totalsgrid{display:grid;grid-template-columns:1fr 90px;gap:6px 8px;align-items:center;margin-top:6px;}
.totalsgrid label{margin:0;}

.bottombar{
  display:flex;gap:8px;position:fixed;bottom:14px;left:18px;
  width:calc(100% - 36px);max-width:404px;
}
button.download{
  flex:1;
  padding:13px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);
  font-weight:600;font-size:0.92rem;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
button.download.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;}
button.download:hover{opacity:0.92;}
button.download:disabled{opacity:0.5;cursor:not-allowed;}

/* preview invoice */
.sheet{
  width:100%;max-width:640px;background:var(--doc-bg,var(--card));color:var(--doc-ink,#1E2B20);
  padding:44px 44px 36px;box-shadow:0 2px 10px rgba(0,0,0,.15);
  font-family:var(--doc-font-body,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);
  min-height:800px;height:fit-content;
}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
.sheet-head .biz{font-family:var(--doc-font-head,"Source Serif 4",Georgia,serif);font-size:1.3rem;font-weight:600;color:var(--doc-ink,#1E2B20);}
.sheet-head .bizinfo{white-space:pre-line;font-size:0.78rem;color:color-mix(in srgb, var(--doc-ink,#1E2B20) 62%, transparent);margin-top:4px;line-height:1.5;}
.sheet-head .doctitle{font-family:var(--doc-font-head,"Source Serif 4",Georgia,serif);font-size:1.6rem;font-weight:600;color:var(--doc-accent,#2E6B4C);text-align:right;}
.sheet-head .docmeta{font-size:0.78rem;color:color-mix(in srgb, var(--doc-ink,#1E2B20) 62%, transparent);text-align:right;margin-top:6px;line-height:1.6;}
.sheet-head .docmeta b{color:var(--doc-ink,#1E2B20);}
.billto{margin-top:26px;}
.billto .lbl{font-size:0.7rem;letter-spacing:.02em;color:color-mix(in srgb, var(--doc-ink,#1E2B20) 45%, transparent);}
.billto .name{font-weight:600;margin-top:3px;}
.billto .addr{white-space:pre-line;font-size:0.82rem;color:color-mix(in srgb, var(--doc-ink,#1E2B20) 62%, transparent);margin-top:2px;line-height:1.5;}
table.itemsprev{width:100%;border-collapse:collapse;margin-top:26px;font-size:0.84rem;}
table.itemsprev thead th{
  text-align:left;font-size:0.72rem;color:color-mix(in srgb, var(--doc-ink,#1E2B20) 45%, transparent);font-weight:600;border-bottom:1.5px solid var(--doc-ink,#1E2B20);padding-bottom:7px;
}
table.itemsprev thead th.num, table.itemsprev td.num{text-align:right;}
table.itemsprev tbody td{padding:9px 0;border-bottom:1px solid color-mix(in srgb, var(--doc-ink,#1E2B20) 12%, transparent);}
.prev-totals{margin-top:16px;margin-left:auto;width:min(260px,55%);}
.prev-totals .row{display:flex;justify-content:space-between;font-size:0.86rem;padding:4px 0;}
.prev-totals .row.total{border-top:1.5px solid var(--doc-ink,#1E2B20);margin-top:6px;padding-top:8px;font-weight:700;font-size:1.02rem;color:var(--doc-accent,#2E6B4C);}
.prev-notes{margin-top:30px;font-size:0.78rem;color:color-mix(in srgb, var(--doc-ink,#1E2B20) 62%, transparent);white-space:pre-line;border-top:1px solid color-mix(in srgb, var(--doc-ink,#1E2B20) 12%, transparent);padding-top:14px;}

@media (max-width:800px){
  .shell{flex-direction:column;overflow-y:auto;}
  .formcol{width:100%;border-right:none;border-bottom:1px solid var(--line);overflow:visible;max-height:none;}
  .previewcol{overflow:visible;padding:20px 12px 90px;}
  .bottombar{max-width:calc(100vw - 36px);}
  .sheet{padding:26px 22px 22px;}
}
::-webkit-scrollbar{width:11px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← Herramientas Gratis</a>
  <h1>Generador de Facturas</h1>
  <span class="tag">gratis, sin cuentas, sin marca de agua</span>
  <button class="fb-btn" id="fbOpenBtn">💬 Comentarios / errores</button>
</header>
<div class="shell">
  <div class="formcol" id="formcol">

    <div class="section">
      <h2>Tu negocio</h2>
      <label>Nombre</label><input type="text" id="bizName" placeholder="Tu Negocio S.A.">
      <label>Logo (opcional)</label>
      <div style="display:flex;align-items:center;gap:10px;margin-top:2px;">
        <input type="file" id="logoInput" accept="image/*" style="flex:1;font-size:0.78rem;">
        <img id="logoPreview" style="display:none;max-height:40px;max-width:90px;border-radius:4px;">
        <button type="button" id="logoClear" style="display:none;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:0.9rem;">✕</button>
      </div>
      <label>Dirección / contacto (una línea por renglón)</label>
      <textarea id="bizInfo" placeholder="Calle 123, Ciudad&#10;correo@negocio.com&#10;33 1234 5678"></textarea>
    </div>

    <div class="section">
      <h2>Cliente</h2>
      <label>Nombre</label><input type="text" id="cliName" placeholder="Nombre del cliente">
      <label>Dirección / contacto</label>
      <textarea id="cliInfo" placeholder="Dirección del cliente"></textarea>
    </div>

    <div class="section">
      <h2>Datos del documento</h2>
      <div class="grid2">
        <div><label>Tipo</label>
          <select id="docType">
            <option value="Factura">Factura</option>
            <option value="Recibo">Recibo</option>
            <option value="Nota de venta">Nota de venta</option>
          </select>
        </div>
        <div><label>Número (opcional)</label><input type="text" id="docNum" placeholder="001"></div>
      </div>
      <div class="grid2">
        <div><label>Fecha (opcional)</label><input type="date" id="docDate"></div>
        <div><label>Vence (opcional)</label><input type="date" id="docDue"></div>
      </div>
      <div class="grid2">
        <div><label>Símbolo de moneda</label><input type="text" id="currency" value="$"></div>
        <div><label>Método de pago (opcional)</label><input type="text" id="payMethod" placeholder="Efectivo, transferencia…"></div>
      </div>
    </div>

    <div class="section">
      <h2>Personalizar</h2>
      <div class="grid2">
        <div><label>Color de acento</label><input type="color" id="colAccent" value="#2E6B4C" style="height:34px;padding:2px;"></div>
        <div><label>Color de texto</label><input type="color" id="colInk" value="#1E2B20" style="height:34px;padding:2px;"></div>
      </div>
      <label>Color de fondo de la hoja</label>
      <input type="color" id="colBg" value="#FBFAF4" style="height:34px;padding:2px;">
      <div class="grid2">
        <div><label>Fuente de títulos</label>
          <select id="fontHead">
            <option value='"Source Serif 4",Georgia,serif' selected>Serif clásica</option>
            <option value='Georgia,serif'>Georgia</option>
            <option value='"Times New Roman",Times,serif'>Times</option>
            <option value='-apple-system,"Segoe UI",Roboto,sans-serif'>Sans moderna</option>
            <option value='"Courier New",monospace'>Máquina de escribir</option>
          </select>
        </div>
        <div><label>Fuente de texto</label>
          <select id="fontBody">
            <option value='-apple-system,"Segoe UI",Roboto,sans-serif' selected>Sans moderna</option>
            <option value='Georgia,serif'>Serif</option>
            <option value='"Courier New",monospace'>Máquina de escribir</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Conceptos</h2>
      <div class="items" id="itemsWrap"></div>
      <button class="addrow" id="addItem">+ Agregar renglón</button>
    </div>

    <div class="section">
      <h2>Totales</h2>
      <div class="totalsgrid">
        <label style="margin:0;">Impuesto (%)</label><input type="number" id="taxPct" value="0" min="0">
        <label style="margin:0;">Descuento</label>
        <div style="display:flex;gap:6px;">
          <input type="number" id="discAmt" value="0" min="0" style="flex:1;">
          <select id="discType" style="border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:0.86rem;padding:0 4px;">
            <option value="amount" selected>$</option>
            <option value="pct">%</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Notas / condiciones</h2>
      <textarea id="notes" placeholder="Gracias por su compra. Pago a 15 días."></textarea>
    </div>
  </div>

  <div class="previewcol">
    <div class="sheet" id="sheet"></div>
  </div>
</div>
<div class="bottombar">
  <button class="download secondary" id="printBtn">Imprimir</button>
  <button class="download" id="downloadBtn">Descargar PDF</button>
</div>

<script>
const { PDFDocument, rgb, StandardFonts } = PDFLib;

const $ = id => document.getElementById(id);
let items = [ {desc:'', qty:1, price:0}, {desc:'', qty:1, price:0} ];
let logoDataUrl = null;

$('logoInput').addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    logoDataUrl = reader.result;
    $('logoPreview').src = logoDataUrl;
    $('logoPreview').style.display='inline-block';
    $('logoClear').style.display='inline-block';
    renderPreview();
  };
  reader.readAsDataURL(f);
});
$('logoClear').addEventListener('click', ()=>{
  logoDataUrl=null; $('logoInput').value='';
  $('logoPreview').style.display='none'; $('logoClear').style.display='none';
  renderPreview();
});

function applyCustomStyles(){
  const sheet = $('sheet');
  sheet.style.setProperty('--doc-accent', $('colAccent').value);
  sheet.style.setProperty('--doc-ink', $('colInk').value);
  sheet.style.setProperty('--doc-bg', $('colBg').value);
  sheet.style.setProperty('--doc-font-head', $('fontHead').value);
  sheet.style.setProperty('--doc-font-body', $('fontBody').value);
}
['colAccent','colInk','colBg','fontHead','fontBody'].forEach(id=>{
  $(id).addEventListener('input', ()=>{ applyCustomStyles(); });
});

function hexToRgb01(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16)/255;
  const g = parseInt(h.substring(2,4),16)/255;
  const b = parseInt(h.substring(4,6),16)/255;
  return {r,g,b};
}
function pdfFontFamily(cssVal){
  if(cssVal.includes('Times') || cssVal.includes('Georgia')) return 'serif';
  if(cssVal.includes('Courier')) return 'mono';
  return 'sans';
}
function fmt(n){
  const v = isFinite(n) ? n : 0;
  return v.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function renderItemsForm(){
  const wrap = $('itemsWrap');
  wrap.innerHTML='';
  items.forEach((it,i)=>{
    const row=document.createElement('div'); row.className='item-row';
    row.innerHTML=`
      <input type="text" placeholder="Descripción" value="${it.desc.replace(/"/g,'&quot;')}">
      <input type="number" min="0" step="1" value="${it.qty}">
      <input type="number" min="0" step="0.01" value="${it.price}">
      <button class="rm" title="Quitar">✕</button>`;
    const [descI, qtyI, priceI] = row.querySelectorAll('input');
    descI.addEventListener('input', ()=>{ it.desc=descI.value; renderPreview(); });
    qtyI.addEventListener('input', ()=>{ it.qty=parseFloat(qtyI.value)||0; renderPreview(); });
    priceI.addEventListener('input', ()=>{ it.price=parseFloat(priceI.value)||0; renderPreview(); });
    row.querySelector('.rm').addEventListener('click', ()=>{ items.splice(i,1); renderItemsForm(); renderPreview(); });
    wrap.appendChild(row);
  });
}
$('addItem').addEventListener('click', ()=>{ items.push({desc:'',qty:1,price:0}); renderItemsForm(); renderPreview(); });

function computeTotals(){
  const subtotal = items.reduce((s,it)=> s + (it.qty*it.price), 0);
  const taxPct = parseFloat($('taxPct').value)||0;
  const discRaw = parseFloat($('discAmt').value)||0;
  const discType = $('discType').value;
  const taxAmt = subtotal * (taxPct/100);
  const disc = discType==='pct' ? subtotal*(discRaw/100) : discRaw;
  const total = Math.max(0, subtotal + taxAmt - disc);
  return {subtotal, taxPct, taxAmt, disc, discRaw, discType, total};
}

function renderPreview(){
  const cur = $('currency').value || '$';
  const {subtotal, taxPct, taxAmt, disc, discRaw, discType, total} = computeTotals();
  const bizName = $('bizName').value || 'Tu Negocio';
  const bizInfo = $('bizInfo').value;
  const cliName = $('cliName').value || 'Nombre del cliente';
  const cliInfo = $('cliInfo').value;
  const docType = $('docType').value || 'Factura';
  const docNum = $('docNum').value;
  const docDate = $('docDate').value ? new Date($('docDate').value+'T00:00:00').toLocaleDateString('es-MX') : '';
  const docDue = $('docDue').value ? new Date($('docDue').value+'T00:00:00').toLocaleDateString('es-MX') : '';
  const notes = $('notes').value;
  const payMethod = $('payMethod').value;
  const billLabel = docType==='Recibo' ? 'RECIBÍ DE' : 'FACTURAR A';

  const rows = items.map(it=>`
    <tr>
      <td>${(it.desc||'—')}</td>
      <td class="num">${it.qty}</td>
      <td class="num">${cur}${fmt(it.price)}</td>
      <td class="num">${cur}${fmt(it.qty*it.price)}</td>
    </tr>`).join('');

  $('sheet').innerHTML = `
    <div class="sheet-head">
      <div>
        <div class="biz">${bizName}</div>
        ${logoDataUrl?`<img src="${logoDataUrl}" style="max-height:46px;max-width:180px;margin-top:6px;display:block;">`:''}
        <div class="bizinfo">${bizInfo.replace(/</g,'&lt;')}</div>
      </div>
      <div>
        <div class="doctitle">${docType}</div>
        <div class="docmeta">
          ${docNum?`<div>No. <b>${docNum}</b></div>`:''}
          ${docDate?`<div>Fecha: <b>${docDate}</b></div>`:''}
          ${docDue?`<div>Vence: <b>${docDue}</b></div>`:''}
          ${payMethod?`<div>Pago: <b>${payMethod.replace(/</g,'&lt;')}</b></div>`:''}
        </div>
      </div>
    </div>
    <div class="billto">
      <div class="lbl">${billLabel}</div>
      <div class="name">${cliName}</div>
      <div class="addr">${cliInfo.replace(/</g,'&lt;')}</div>
    </div>
    <table class="itemsprev">
      <thead><tr><th>Descripción</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="prev-totals">
      <div class="row"><span>Subtotal</span><span>${cur}${fmt(subtotal)}</span></div>
      ${taxPct>0?`<div class="row"><span>Impuesto (${taxPct}%)</span><span>${cur}${fmt(taxAmt)}</span></div>`:''}
      ${disc>0?`<div class="row"><span>Descuento${discType==='pct'?` (${discRaw}%)`:''}</span><span>-${cur}${fmt(disc)}</span></div>`:''}
      <div class="row total"><span>Total</span><span>${cur}${fmt(total)}</span></div>
    </div>
    ${notes?`<div class="prev-notes">${notes.replace(/</g,'&lt;')}</div>`:''}
  `;
}

document.querySelectorAll('#formcol input, #formcol textarea, #formcol select').forEach(el=>{
  el.addEventListener('input', renderPreview);
  el.addEventListener('change', renderPreview);
});

renderItemsForm();
renderPreview();
applyCustomStyles();

/* ---------- PDF export ---------- */
let _downloadsNS = null;
async function getDownloads(){
  if(_downloadsNS!==null) return _downloadsNS;
  try{ if(window.claude && window.claude.use) _downloadsNS = await window.claude.use('downloads'); }
  catch(e){ _downloadsNS = null; }
  return _downloadsNS;
}
async function saveFile(bytes, name){
  const blob = new Blob([bytes], {type:'application/pdf'});
  const dl = await getDownloads();
  if(dl){
    try{ await dl.save({filename:name, data:blob}); return; }catch(e){}
  }
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

$('downloadBtn').addEventListener('click', async ()=>{
  const btn = $('downloadBtn');
  btn.disabled=true; btn.textContent='Generando…';
  try{
    const doc = await PDFDocument.create();
    const page = doc.addPage([612,792]); // letter
    const famChoice = pdfFontFamily($('fontHead').value);
    const fontPairs = {
      sans:  [StandardFonts.Helvetica, StandardFonts.HelveticaBold],
      serif: [StandardFonts.TimesRoman, StandardFonts.TimesRomanBold],
      mono:  [StandardFonts.Courier, StandardFonts.CourierBold],
    };
    const bodyFamChoice = pdfFontFamily($('fontBody').value);
    const [regName, boldName] = fontPairs[famChoice] || fontPairs.sans;
    const [bodyRegName] = fontPairs[bodyFamChoice] || fontPairs.sans;
    const fontR = await doc.embedFont(bodyRegName);
    const fontB = await doc.embedFont(boldName);
    const accRgb = hexToRgb01($('colAccent').value);
    const inkRgb = hexToRgb01($('colInk').value);
    const green = rgb(accRgb.r,accRgb.g,accRgb.b);
    const ink = rgb(inkRgb.r,inkRgb.g,inkRgb.b);
    const soft = rgb(inkRgb.r*0.55+0.35, inkRgb.g*0.55+0.35, inkRgb.b*0.55+0.35);
    let y = 740;
    const cur = $('currency').value || '$';
    const bizName = $('bizName').value || 'Tu Negocio';
    const bizLines = ($('bizInfo').value||'').split('\n').filter(Boolean);
    const cliName = $('cliName').value || 'Nombre del cliente';
    const cliLines = ($('cliInfo').value||'').split('\n').filter(Boolean);
    const docType = $('docType').value || 'Factura';
    const docNum = $('docNum').value;
    const docDate = $('docDate').value ? new Date($('docDate').value+'T00:00:00').toLocaleDateString('es-MX') : '';
    const docDue = $('docDue').value ? new Date($('docDue').value+'T00:00:00').toLocaleDateString('es-MX') : '';
    const payMethod = $('payMethod').value||'';
    const notes = $('notes').value||'';
    const billLabel = docType==='Recibo' ? 'RECIBÍ DE' : 'FACTURAR A';

    page.drawText(bizName, {x:50, y, size:18, font:fontB, color:ink}); 
    page.drawText(docType, {x:400, y, size:20, font:fontB, color:green});
    y -= 18;
    if(logoDataUrl){
      try{
        const isPng = logoDataUrl.startsWith('data:image/png');
        const b64 = logoDataUrl.split(',')[1];
        const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
        const embedded = isPng ? await doc.embedPng(bin) : await doc.embedJpg(bin);
        const maxW=140, maxH=42;
        const ratio = Math.min(maxW/embedded.width, maxH/embedded.height, 1);
        const w = embedded.width*ratio, h = embedded.height*ratio;
        page.drawImage(embedded, {x:50, y:y-h+4, width:w, height:h});
        y -= (h+8);
      }catch(e){ /* unsupported image format, skip silently */ }
    }
    bizLines.forEach(line=>{ page.drawText(line, {x:50,y,size:9,font:fontR,color:soft}); y-=13; });
    let yMeta = 722;
    const metaRows = [];
    if(docNum) metaRows.push(['No.',docNum]);
    if(docDate) metaRows.push(['Fecha',docDate]);
    if(docDue) metaRows.push(['Vence',docDue]);
    if(payMethod) metaRows.push(['Pago', payMethod]);
    metaRows.forEach(([k,v])=>{
      page.drawText(`${k}: ${v}`, {x:400,y:yMeta,size:9,font:fontR,color:soft}); yMeta-=13;
    });
    y = Math.min(y, metaRows.length? yMeta : y) - 26;

    page.drawText(billLabel, {x:50,y,size:8,font:fontB,color:soft}); y-=13;
    page.drawText(cliName, {x:50,y,size:11,font:fontB,color:ink}); y-=14;
    cliLines.forEach(line=>{ page.drawText(line, {x:50,y,size:9,font:fontR,color:soft}); y-=12; });

    y -= 20;
    page.drawLine({start:{x:50,y},end:{x:562,y},thickness:1.2,color:ink});
    y -= 14;
    page.drawText('Descripción', {x:50,y,size:8,font:fontB,color:soft});
    page.drawText('Cant.', {x:360,y,size:8,font:fontB,color:soft});
    page.drawText('Precio', {x:440,y,size:8,font:fontB,color:soft});
    page.drawText('Importe', {x:510,y,size:8,font:fontB,color:soft});
    y -= 10;
    page.drawLine({start:{x:50,y},end:{x:562,y},thickness:0.6,color:rgb(0.85,0.87,0.8)});
    y -= 14;

    items.forEach(it=>{
      if(y < 130){ return; } // simple: skip overflow beyond first page for this basic version
      const desc = it.desc || '—';
      page.drawText(desc.slice(0,48), {x:50,y,size:9.5,font:fontR,color:ink});
      page.drawText(String(it.qty), {x:360,y,size:9.5,font:fontR,color:ink});
      page.drawText(cur+fmt(it.price), {x:440,y,size:9.5,font:fontR,color:ink});
      page.drawText(cur+fmt(it.qty*it.price), {x:510,y,size:9.5,font:fontR,color:ink});
      y -= 16;
      page.drawLine({start:{x:50,y:y+6},end:{x:562,y:y+6},thickness:0.4,color:rgb(0.9,0.92,0.87)});
    });

    const {subtotal, taxPct, taxAmt, disc, discRaw, discType, total} = computeTotals();
    y -= 10;
    const tx = 400;
    function totalRow(label, val, bold){
      page.drawText(label, {x:tx,y,size:bold?11:9.5,font:bold?fontB:fontR,color:bold?green:soft});
      page.drawText(cur+fmt(val), {x:510,y,size:bold?11:9.5,font:bold?fontB:fontR,color:bold?green:ink});
      y -= bold?18:14;
    }
    totalRow('Subtotal', subtotal, false);
    if(taxPct>0) totalRow(`Impuesto (${taxPct}%)`, taxAmt, false);
    if(disc>0) totalRow(`Descuento${discType==='pct'?` (${discRaw}%)`:''}`, -disc, false);
    page.drawLine({start:{x:tx,y:y+8},end:{x:562,y:y+8},thickness:1,color:ink});
    y -= 4;
    totalRow('Total', total, true);

    if(notes){
      y -= 16;
      page.drawLine({start:{x:50,y:y+10},end:{x:562,y:y+10},thickness:0.6,color:rgb(0.9,0.92,0.87)});
      const noteLines = notes.split('\n');
      noteLines.forEach(line=>{
        page.drawText(line.slice(0,95), {x:50,y,size:9,font:fontR,color:soft}); y-=12;
      });
    }

    const bytes = await doc.save();
    const safeName = (docType+(docNum?'-'+docNum:'')).toLowerCase().replace(/[^a-z0-9-]+/g,'-');
    await saveFile(bytes, `${safeName}.pdf`);
  } finally {
    btn.disabled=false; btn.textContent='Descargar PDF';
  }
});

    <h3>💬 ¿Falta algo o algo no sirve?</h3>
    <p style="margin:0 0 14px;color:var(--ink-soft);font-size:0.82rem;line-height:1.5;">Cuéntame qué herramienta te gustaría ver, o repórtame si algo está fallando.</p>
    <form action="https://formsubmit.co/musica.wasd@gmail.com" method="POST" target="fbFrame_hidden">
      <input type="hidden" name="_subject" value="Facturas-Generador Feedback">
      <input type="hidden" name="_captcha" value="false">
      <input type="email" name="Tu correo (opcional)" placeholder="Tu correo (opcional, por si quieres respuesta)">
      <textarea name="Mensaje" placeholder="Escribe tu recomendación o problema aquí..." required></textarea>
      <div class="mrow">
        <button type="button" class="btn" id="fbCancel">Cancelar</button>
        <button type="submit" class="btn primary" id="fbSubmit">Enviar</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(bg);

  let iframe = document.getElementById('fbFrame_hidden');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.name='fbFrame_hidden'; iframe.id='fbFrame_hidden'; iframe.style.display='none';
    document.body.appendChild(iframe);
  }

  const form = bg.querySelector('form');
  bg.querySelector('#fbCancel').onclick = ()=> bg.remove();
  form.addEventListener('submit', ()=>{
    const btn = bg.querySelector('#fbSubmit');
    btn.disabled = true; btn.textContent = 'Enviando…';
    setTimeout(()=>{
      bg.innerHTML = `<div class="modal"><h3>¡Gracias! 🙌</h3>
        <p style="margin:0 0 14px;color:var(--ink-soft);font-size:0.88rem;">Tu comentario fue enviado.</p>
        <div class="mrow"><button class="btn primary" id="fbClose">Cerrar</button></div></div>`;
      bg.querySelector('#fbClose').onclick = ()=> bg.remove();
    }, 900);
  });
}
